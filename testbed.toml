# How the testbed tests and checks this repository, in the testbed's declaration format.
testbed = 0
name = "bmo-cache-warmer"

[test]
languages = ["cargo"]

[check]
quick = ["layout", "dependencies", "korean"]
# No code file holds Korean, so the ledger allows none anywhere.
korean_ledger = "korean-ledger.json"
# The warmer calls no other unit and serves no screen, so no other repository is a dependency.
base_libraries = []

[build]
binaries = ["bmo-cache-warmer"]

# The service runs from its own deploy tree and keeps its store in its own data root
# (docs/api.md, "The deployed service").
[deploy]
root = "~/.local/share/bmo-cache-warmer"
data_root = "~/.local/share/bmo-cache-warmer/data"
units = ["deploy/systemd/*.service"]
# Answers 0 once the service answers ready on its address, asked with the token in the data root.
health = "~/.local/share/bmo-cache-warmer/deploy/bin/bmo-cache-warmer health --address http://127.0.0.1:9023 --token-file ~/.local/share/bmo-cache-warmer/data/token"

# The service's bearer token, made once where none stands yet and kept across deployments, so the callers
# given it keep reaching every route (docs/api.md, "The deployed service").
[[deploy.step]]
id = "make-token"
phase = "before-flip"
command = '''
set -eu
token="$HOME/.local/share/bmo-cache-warmer/data/token"
mkdir -p "$(dirname "$token")"
if [ ! -s "$token" ]; then
  (umask 077 && od -An -tx1 -N32 /dev/urandom | tr -d ' \n' > "$token")
fi
'''

# The binary, linked into the folder holding `bmo`, so a harness starts the MCP server as
# `bmo-cache-warmer mcp` (docs/api.md, "The deployed service"). The link names this repository's deploy
# tree, whose own link stands across releases; a link made to the release being deployed would dangle
# once a later deployment prunes that release.
[[deploy.step]]
id = "link-unit-command"
phase = "before-flip"
command = '''
set -eu
bmo_dir="$(dirname "$(command -v bmo)")"
ln -sfn "$HOME/.local/share/bmo-cache-warmer/deploy/bin/bmo-cache-warmer" "$bmo_dir/bmo-cache-warmer"
'''

# A deployment backs the store up before anything changes (docs/api.md, "The deployed service"). The
# live release binary writes a consistent copy and holds it to its manifest; before the first
# deployment there is no release binary, and the backup then passes only while no store stands either.
# The store and its journal files are left out of the raw pack, since the snapshot is their copy.
[deploy.backup]
dir = "~/.local/share/bmo-cache-warmer/backups"
snapshot = '''
if test -x ~/.local/share/bmo-cache-warmer/deploy/bin/bmo-cache-warmer; then
  exec ~/.local/share/bmo-cache-warmer/deploy/bin/bmo-cache-warmer snapshot --store ~/.local/share/bmo-cache-warmer/data/warmer.sqlite
elif test -e ~/.local/share/bmo-cache-warmer/data/warmer.sqlite; then
  echo "The store stands, but no release binary stands to copy it." >&2
  exit 1
fi
'''
verify = '''
if test -x ~/.local/share/bmo-cache-warmer/deploy/bin/bmo-cache-warmer; then
  exec ~/.local/share/bmo-cache-warmer/deploy/bin/bmo-cache-warmer verify
elif test -e "$BMO_BACKUP_SNAPSHOT_DIR/manifest.json"; then
  echo "The snapshot holds a manifest, but no release binary stands to verify it." >&2
  exit 1
fi
'''
exclude = ["warmer.sqlite", "warmer.sqlite-journal", "warmer.sqlite-wal", "warmer.sqlite-shm"]

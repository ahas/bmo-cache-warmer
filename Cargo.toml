# The workspace: the service package at the root, which Cargo takes as a member of its own workspace, and the
# schedule crate in `schedule/`, one version for both.
[workspace]
members = ["schedule"]

[workspace.package]
version = "0.1.0-rev.6"
edition = "2024"
license = "MIT"

# The service package: the service with its client, its OpenAPI document and the harness plugin's MCP
# server, and the one binary that serves, answers the plugin and takes snapshots. The repository checks and
# the service's tests live in `tests/`.
[package]
name = "bmo-cache-warmer"
description = "A keepalive scheduler: keeps registered prompt-cache prefixes warm by asking their consumers to ping them."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[dependencies]
# The service's routes and its event stream.
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
# The schedule rule, re-exported as `schedule`.
bmo-cache-warmer-schedule = { path = "schedule" }
clap = { version = "4.6.7", features = ["derive", "env"] }
# The event stream's body.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# The pings to consumers' hooks and the client's calls to the service.
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
# The harness plugin's MCP server.
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-io"] }
# The JSON Schemas of the bodies, the tools' inputs and outputs and the OpenAPI document.
schemars = "1.2.3"
sea-orm = { version = "1.1.20", default-features = false, features = ["runtime-tokio", "sqlx-sqlite"] }
sea-orm-migration = { version = "1.1.20", default-features = false, features = ["runtime-tokio", "sqlx-sqlite"] }
serde = { version = "1.0.219", features = ["derive"] }
# The OpenAPI document keeps its keys in the order the code writes them.
serde_json = { version = "1.0.138", features = ["preserve_order"] }
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[dev-dependencies]
# The personal-data check reads every file for the forms it may not hold.
regex = "1.13.1"
# The tests serve the router and a fake consumer on loopback, and drive the ticker on a paused clock.
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }

[[test]]
name = "main"
path = "tests/main.rs"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.release]
debug = false
strip = "debuginfo"

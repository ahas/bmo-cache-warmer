# The service as one package at the root: the library and the binary that serves it. The repository
# checks and the service's tests live in `tests/`.
[package]
name = "bmo-cache-warmer"
description = "A keepalive scheduler: keeps registered prompt-cache prefixes warm by asking their consumers to ping them."
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
sea-orm = { version = "1.1.20", default-features = false, features = ["runtime-tokio", "sqlx-sqlite"] }
sea-orm-migration = { version = "1.1.20", default-features = false, features = ["runtime-tokio", "sqlx-sqlite"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt", "sync", "time"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[dev-dependencies]
# The pass's tests post to a fake consumer: an in-process server on loopback.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "net", "rt", "sync", "time"] }

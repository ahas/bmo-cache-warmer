# The warmer's own fixed numbers (docs/warming.md, "The policy"). A target's clocks are its registration's;
# this file fills in only what a registration leaves out. Nothing here bounds how long a ping may take while
# the service runs; only a stop's drain deadline cuts one.

# How long after the service starts the first pass waits: a starting host has real work to do first,
# and warming is upkeep. The wait and a target's idle stretch still land inside the caches it keeps.
start_delay_seconds = 30

# How often the pass comes round while no interval is set on the round.
tick_seconds = 60

# Whether a target warms when neither its registration nor its subject's switch says. Off: nothing is
# warmed that nobody asked for.
warm_by_default = false

# A registration's idle stretch where it states none, as this share of its lifetime less its margin: late
# enough that a busy prefix is not pinged for nothing, early enough that a ping lands before it drops.
idle_percent = 66

# How many UTF-16 units of a failed attempt's reason are kept, the way a script counts a string.
reason_units = 400

# How many days an attempt stays in the attempt log; each pass, as it ends, removes what is older.
log_days = 14

# How many days an event stays in the event window; each pass, as it ends, removes what is older.
event_days = 2

# How long a stop waits for the calls, pings and passes in flight before it cuts them, counted from the
# signal: long enough for a call or a ping already out to finish, short enough that a deployment's restart
# is not held up by a hook that never answers.
drain_seconds = 15
